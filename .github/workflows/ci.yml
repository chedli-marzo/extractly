name: CI

on:
  push:
    branches: [main]
  pull_request:

# The workflow uploads build output and nothing else. No test reporter service,
# no coverage upload, no annotation action that transmits source. This project
# exists because the documents it handles are confidential, and CI is the first
# place its code runs on someone else's machine.
permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows is the primary test platform (ADR-0002).
          - os: windows-latest
            name: win-x64
          - os: macos-latest
            name: mac-arm64

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    env:
      # Never set. It makes the Electron binary behave as plain Node, and
      # scripts/ci.mjs refuses to run when it is present.
      ELECTRON_RUN_AS_NODE: ''

    steps:
      - uses: actions/checkout@v4

      # No `version` input, deliberately. The action reads `packageManager`
      # from package.json when the input is absent, so the pinned version has
      # exactly one home and cannot drift from what scripts/ci.mjs enforces.
      # Passing `version: false` does not mean "unset" — the action reads it as
      # a specified version and fails with "Multiple versions of pnpm
      # specified".
      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: pnpm

      # Electron downloads its binary on first launch rather than at install,
      # because install scripts are disabled. Cached by version so a cold
      # runner does not fetch it on every run.
      - name: Cache the Electron binary
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/Library/Caches/electron
            ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # `dist/` and `*.tsbuildinfo` are cached together or not at all. `tsc -b`
      # fails with TS6305 when the build info survives but its declarations do
      # not, because it believes output it cannot find is current — a state
      # unreachable locally and trivially reachable through a partial restore.
      - name: Cache TypeScript build output
        uses: actions/cache@v4
        with:
          path: |
            packages/*/dist
            apps/desktop/dist
            dist
            **/*.tsbuildinfo
          key: tsbuild-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'tsconfig*.json') }}-${{ github.sha }}
          restore-keys: |
            tsbuild-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'tsconfig*.json') }}-

      # One command, so the order cannot drift from what a developer runs.
      # install → typecheck → lint → format:check → build → test, and `build`
      # precedes `test` because tests/security reads the built artifact.
      - name: Run the check sequence
        run: pnpm check

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: out-${{ matrix.name }}
          path: apps/desktop/out
          retention-days: 7
